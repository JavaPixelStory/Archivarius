name: Сборка

# Собирает программу на трёх системах параллельно: каждая сборка идёт
# на своей машине, потому что PyInstaller не умеет собирать под чужую ОС.
#
# Запуск: вручную (Actions → Сборка → Run workflow)
#         или автоматически при публикации тега вида v2.0.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}

    # На Windows стандартный вывод — cp1252, и любой print с кириллицей
    # падает с UnicodeEncodeError. Эти две переменные переводят Python
    # в режим UTF-8 независимо от локали системы.
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux — системные пакеты для Tk
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      # Тесты создают JPEG/PDF/DOCX на лету, поэтому Pillow нужен им,
      # а не только сборке. Раньше зависимости ставил build.py — уже после
      # тестов, и на macOS/Linux они падали с ModuleNotFoundError: PIL.
      - name: Зависимости
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: Тесты ядра
        run: python -B test_core.py

      - name: Сборка
        run: python build.py

      - name: Загрузить архив
        uses: actions/upload-artifact@v4
        with:
          name: Archivarius-${{ runner.os }}
          path: dist/Archivarius-*
          if-no-files-found: error

  release:
    # Публикуем релиз только при выпуске тега, вручную — нет.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
